<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>共享文件池</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --bg: #f8fafc;
    --card: #ffffff;
    --border: #e2e8f0;
    --text: #0f172a;
    --text-2: #64748b;
    --accent: #2563eb;
    --accent-2: #1d4ed8;
    --radius: 12px;
  }
  html.dark {
    --bg: #0f172a;
    --card: #1e293b;
    --border: #334155;
    --text: #f1f5f9;
    --text-2: #94a3b8;
    --accent: #3b82f6;
    --accent-2: #2563eb;
  }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
      "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  /* ---------- Header ---------- */
  header {
    position: sticky; top: 0; z-index: 20;
    background: var(--card);
    border-bottom: 1px solid var(--border);
    box-shadow: 0 1px 3px rgba(0,0,0,.04);
  }
  .header-inner {
    max-width: 1280px; margin: 0 auto;
    padding: 12px 16px;
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
  }
  .brand { display: flex; align-items: center; gap: 10px; }
  .brand svg { width: 30px; height: 30px; color: var(--accent); flex-shrink: 0; }
  .brand h1 { font-size: 18px; font-weight: 700; line-height: 1.2; }
  .brand p { font-size: 11px; color: var(--text-2); }
  .header-actions { display: flex; align-items: center; gap: 8px; }
  .header-actions span.count,
  .header-actions span.mobile-hint { font-size: 13px; color: var(--text-2); margin-right: 6px; }
  .icon-btn {
    width: 36px; height: 36px; border: none; border-radius: 8px;
    background: transparent; color: var(--text-2); cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center;
    transition: background .15s, color .15s;
  }
  .icon-btn:hover { background: var(--bg); color: var(--text); }
  .icon-btn svg { width: 18px; height: 18px; }
  .mobile-hint { display: none; }
  @media (max-width: 640px) { .mobile-hint { display: inline; } .desktop-hint { display: none; } }
  .icon-btn.highlight { color: var(--accent); }

  /* ---------- 数据统计看板（顶部常驻胶囊） ---------- */
  .stats-bar {
    flex: 1; display: flex; align-items: center; gap: 6px;
    overflow-x: auto; scrollbar-width: none;
    padding: 2px 6px; min-width: 0;
  }
  .stats-bar::-webkit-scrollbar { display: none; }
  .stat-pill {
    display: inline-flex; align-items: center; gap: 5px;
    padding: 3px 10px; border-radius: 999px;
    background: rgba(100,116,139,.12); color: var(--text-2);
    font-size: 12px; white-space: nowrap;
  }
  .stat-pill b { font-weight: 600; color: var(--text); }
  .stat-pill.main { background: rgba(37,99,235,.13); color: var(--accent); }
  .stat-pill.main b { color: var(--accent); }
  @media (max-width: 760px) { .stat-pill.cat-pill { display: none; } }

  /* ---------- Upload toast ---------- */
  .toast {
    position: fixed; left: 50%; top: 14px; transform: translateX(-50%) translateY(-80px);
    background: var(--text); color: var(--bg); padding: 10px 18px;
    border-radius: 10px; font-size: 13px; z-index: 60;
    opacity: 0; transition: transform .25s, opacity .25s;
    box-shadow: 0 4px 16px rgba(0,0,0,.2); pointer-events: none;
  }
  .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }

  /* ---------- Search overlay ---------- */
  .search-bar {
    max-width: 1280px; margin: 0 auto; padding: 0 16px 10px;
    display: none;
  }
  .search-bar.open { display: block; }
  .search-input {
    width: 100%; padding: 8px 12px;
    border: 1px solid var(--border); border-radius: 8px;
    background: var(--bg); color: var(--text); font-size: 14px;
  }
  .search-input:focus { outline: none; border-color: var(--accent); }

  /* ---------- Folder strip / settings ---------- */
  .folder-strip {
    max-width: 1280px; margin: 0 auto; padding: 0 16px 10px;
  }
  .folder-strip .chip-row { display: flex; gap: 6px; flex-wrap: wrap; }
  .folder-chip {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 12px; color: var(--text-2);
    background: var(--card); border: 1px solid var(--border);
    padding: 3px 12px; border-radius: 8px;
  }
  .folder-chip b { color: var(--text); font-weight: 600; }
  .folder-list-head {
    display: flex; flex-direction: column; gap: 8px; margin-bottom: 6px;
  }
  .folder-row {
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
    padding: 8px 10px; border: 1px solid var(--border); border-radius: 10px;
    margin-bottom: 6px; background: var(--card);
  }
  .folder-row .folder-path {
    font-size: 13px; font-family: Consolas, Menlo, monospace; color: var(--text);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }

  /* ---------- 留言板 / 便利贴 ---------- */
  .note-wall {
    margin: 14px 0;
    background: var(--card); border: 1px solid var(--border);
    border-radius: var(--radius); overflow: hidden;
  }
  .note-wall-head {
    display: flex; align-items: center; gap: 10px;
    padding: 12px 16px; cursor: pointer; user-select: none;
  }
  .note-wall-head:hover { background: rgba(100,116,139,.05); }
  .note-wall-head .nw-chevron {
    width: 22px; height: 22px; flex-shrink: 0;
    display: inline-flex; align-items: center; justify-content: center;
    color: var(--text-2); transition: transform .2s;
  }
  .note-wall.collapsed .nw-chevron { transform: rotate(-90deg); }
  .nw-chevron svg { width: 16px; height: 16px; }
  .note-wall-head .nw-title { font-size: 15px; font-weight: 700; }
  .note-wall-head .nw-sub { font-size: 12px; color: var(--text-2); }
  .note-wall-head .nw-add { margin-left: auto; }
  .note-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
    gap: 12px; padding: 4px 16px 16px;
  }
  .note-wall.collapsed .note-grid { display: none; }
  .note {
    position: relative; padding: 14px 14px 12px;
    border-radius: 3px; min-height: 84px;
    box-shadow: 2px 4px 10px rgba(0,0,0,.13);
    color: #27272a;
    transform: rotate(var(--twist, 0deg));
    transition: transform .15s, box-shadow .15s;
  }
  .note:hover { transform: rotate(0deg) scale(1.02); box-shadow: 4px 8px 18px rgba(0,0,0,.18); }
  .note.yellow { background: #fef08a; --twist: -.6deg; }
  .note.pink { background: #fbcfe8; --twist: .7deg; }
  .note.blue { background: #bfdbfe; --twist: -.8deg; }
  .note.green { background: #bbf7d0; --twist: .6deg; }
  .note.orange { background: #fed7aa; --twist: -.4deg; }
  .note::after {
    content: ''; position: absolute; top: 0; right: 0;
    width: 20px; height: 20px;
    background: linear-gradient(135deg, transparent 50%, rgba(0,0,0,.08) 50%);
    border-bottom-left-radius: 4px;
  }
  .note .note-body { font-size: 13px; line-height: 1.65; word-break: break-word; }
  .note .note-body p { margin: 0 0 6px; }
  .note .note-body p:last-child { margin-bottom: 0; }
  .note .note-body a { color: #1d4ed8; text-decoration: underline; }
  .note .note-body ul { margin: 4px 0; padding-left: 18px; }
  .note .note-body b, .note .note-body strong { font-weight: 700; }
  .note .note-body em, .note .note-body i { font-style: italic; }
  .note .note-time { margin-top: 8px; font-size: 11px; color: rgba(39,39,42,.55); display: flex; align-items: center; gap: 10px; }
  .note .note-time .note-tags { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .note-ops {
    position: absolute; top: 6px; right: 6px;
    display: flex; gap: 4px; opacity: 0; transition: opacity .15s; z-index: 2;
  }
  .note:hover .note-ops { opacity: 1; }
  .note-ops button {
    width: 26px; height: 26px; border: none; border-radius: 6px;
    background: rgba(255,255,255,.9); box-shadow: 0 1px 3px rgba(0,0,0,.12);
    display: inline-flex; align-items: center; justify-content: center;
    color: #27272a; cursor: pointer;
  }
  .note-ops button:hover { background: #fff; color: #1d4ed8; }
  .note-ops svg { width: 14px; height: 14px; }
  .note-empty { padding: 26px 16px; text-align: center; color: var(--text-2); font-size: 13px; }

  /* 富文本编辑器 */
  .note-editor-toolbar {
    display: flex; gap: 4px; flex-wrap: wrap; align-items: center;
    padding: 8px 10px; border: 1px solid var(--border); border-bottom: none;
    border-radius: 8px 8px 0 0; background: var(--bg);
  }
  .note-editor-toolbar button {
    width: 34px; height: 30px; border: none; border-radius: 6px;
    background: transparent; color: var(--text); cursor: pointer;
    font-size: 14px; font-weight: 600; display: inline-flex; align-items: center; justify-content: center;
  }
  .note-editor-toolbar button:hover { background: rgba(100,116,139,.15); }
  .note-editor-toolbar .tsep { width: 1px; height: 18px; background: var(--border); margin: 0 4px; }
  .note-editor-toolbar .tbtn-wide { width: auto; padding: 0 10px; font-weight: 500; font-size: 12px; color: var(--text-2); }
  .note-editor {
    min-height: 150px; max-height: 40vh; overflow-y: auto;
    padding: 12px; border: 1px solid var(--border); border-radius: 0 0 8px 8px;
    outline: none; font-size: 14px; line-height: 1.7;
    background: var(--card); color: var(--text);
  }
  .note-editor:focus { border-color: var(--accent); }
  .note-editor:empty::before { content: attr(data-placeholder); color: var(--text-2); pointer-events: none; }
  .note-editor a { color: var(--accent); text-decoration: underline; }
  .note-editor ul { margin: 4px 0; padding-left: 22px; }
  .note-editor ul > li { list-style: disc; margin: 2px 0; }
  .note-editor ol { margin: 4px 0; padding-left: 22px; }
  .note-editor ol > li { list-style: decimal; margin: 2px 0; }
  .note-colors { display: flex; gap: 8px; }
  .note-color {
    width: 30px; height: 30px; border-radius: 50%; cursor: pointer;
    border: 3px solid transparent; box-shadow: inset 0 0 0 1px rgba(0,0,0,.1);
    transition: transform .12s;
  }
  .note-color:hover { transform: scale(1.12); }
  .note-color.active { border-color: var(--text); transform: scale(1.12); }

  /* ---------- Tabs ---------- */
  nav.tabs {
    position: sticky; top: 57px; z-index: 15;
    background: var(--bg);
    max-width: 1280px; margin: 0 auto; padding: 0 16px 10px;
  }
  .tab-list { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: thin; }
  .tab {
    flex-shrink: 0; display: inline-flex; align-items: center; gap: 6px;
    padding: 7px 16px; border-radius: 999px;
    border: none; cursor: pointer;
    font-size: 14px; font-weight: 500;
    background: transparent; color: var(--text-2);
    transition: all .15s;
  }
  .tab:hover { background: rgba(100,116,139,.12); color: var(--text); }
  .tab.active { background: var(--accent); color: #fff; box-shadow: 0 2px 8px rgba(37,99,235,.35); }
  .tab .tab-count {
    padding: 1px 8px; border-radius: 999px; font-size: 12px; font-weight: 600;
    background: rgba(100,116,139,.15); color: var(--text-2);
  }
  .tab.active .tab-count { background: rgba(255,255,255,.25); color: #fff; }
  .tab-sep {
    width: 1px; align-self: stretch; background: var(--border); margin: 2px 4px; flex-shrink: 0;
  }

  /* ---------- File grid ---------- */
  main { flex: 1; max-width: 1280px; margin: 0 auto; padding: 0 16px; width: 100%; }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
    gap: 14px;
    justify-content: start;
  }
  @media (max-width: 640px) {
    .grid { grid-template-columns: repeat(2, 1fr); gap: 10px; }
    .header-inner { padding: 10px 12px; }
    nav.tabs { top: 55px; }
  }
  .empty { text-align: center; padding: 64px 16px; color: var(--text-2); }
  .empty .big { font-size: 56px; margin-bottom: 8px; }

  /* ---------- File card ---------- */
  .card {
    position: relative; background: var(--card);
    border: 1px solid var(--border); border-radius: var(--radius);
    overflow: hidden; cursor: pointer;
    box-shadow: 0 1px 2px rgba(0,0,0,.04);
    transition: transform .15s, box-shadow .15s;
    outline: none;
  }
  .card:hover, .card:focus-visible {
    box-shadow: 0 8px 20px rgba(0,0,0,.12);
    transform: translateY(-2px);
  }
  .thumb {
    position: relative; aspect-ratio: 4/3;
    background: var(--bg); overflow: hidden;
  }
  .thumb img {
    width: 100%; height: 100%; object-fit: cover;
    display: block;
  }
  .thumb.plain {
    display: flex; flex-direction: column;
    align-items: flex-start; justify-content: flex-end;
    padding: 12px;
  }
  .thumb.plain .icon { font-size: 42px; line-height: 1; margin-bottom: auto; }
  .thumb.plain .icon::after { content: none; }
  .thumb.plain .ext-label {
    font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--text-2);
    background: rgba(100,116,139,.1); padding: 2px 8px; border-radius: 6px;
  }
  .thumb .play-overlay {
    position: absolute; inset: 0;
    background: rgba(0,0,0,.28); display: flex; align-items: center; justify-content: center;
  }
  .thumb .play-overlay svg { width: 42px; height: 42px; color: rgba(255,255,255,.92); filter: drop-shadow(0 2px 4px rgba(0,0,0,.4)); }
  .thumb .cat-badge {
    position: absolute; bottom: 6px; right: 6px;
    padding: 2px 8px; border-radius: 6px; font-size: 11px; font-weight: 600; color: #fff;
  }
  .cat-image .cat-badge { background: #3b82f6; }
  .cat-video .cat-badge { background: #10b981; }
  .cat-document .cat-badge { background: #f59e0b; }
  .cat-code .cat-badge { background: #14b8a6; }
  .cat-archive .cat-badge { background: #f97316; }
  .cat-app .cat-badge { background: #8b5cf6; }
  .cat-other .cat-badge { background: #94a3b8; }
  .annotated-mark {
    position: absolute; top: 38px; right: 8px;
    background: var(--accent); color: #fff;
    font-size: 11px; padding: 2px 8px; border-radius: 999px;
    display: flex; align-items: center; gap: 3px;
    z-index: 2;
  }
  .annotated-mark svg { width: 12px; height: 12px; }
  .card-body {
    padding: 10px 12px 12px;
    border-top: 1px solid var(--border);
  }
  .card-name { font-size: 13.5px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .card-meta { margin-top: 4px; font-size: 12px; color: var(--text-2); display: flex; justify-content: space-between; }
  .card-note {
    margin-top: 6px; font-size: 12px; line-height: 1.5; color: #92400e;
    background: rgba(245,158,11,.12); border-radius: 6px; padding: 3px 8px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  html.dark .card-note { color: #fcd34d; background: rgba(245,158,11,.15); }
  .card[draggable='true'] { cursor: grab; }
  .card.dragging { opacity: .4; }
  .card.drop-over { border-color: var(--accent); box-shadow: 0 0 0 2px rgba(37,99,235,.25); }
  .group-card[draggable='true'] { cursor: grab; }
  .group-card.dragging { opacity: .4; }
  .group-card.drop-over { border-color: var(--accent); box-shadow: 0 0 0 2px rgba(37,99,235,.25); }
  .hover-actions {
    position: absolute; top: 6px; left: 6px;
    display: flex; flex-wrap: wrap; gap: 6px;
    width: 70px;
    opacity: 0; transition: opacity .15s; z-index: 3;
  }
  .card:hover .hover-actions, .card:focus-visible .hover-actions { opacity: 1; }
  /* 常驻勾选框（批量选择） */
  .card-select {
    position: absolute; top: 8px; right: 8px; z-index: 4;
    width: 22px; height: 22px; border-radius: 6px; padding: 0;
    border: 2px solid rgba(255,255,255,.9);
    background: rgba(15,23,42,.3);
    display: flex; align-items: center; justify-content: center;
    color: transparent; cursor: pointer;
    transition: background .15s, border-color .15s, color .15s;
    box-shadow: 0 1px 3px rgba(0,0,0,.25);
  }
  .card-select:hover { border-color: #fff; background: rgba(15,23,42,.55); }
  .card-select svg { width: 14px; height: 14px; }
  .card.selected { border-color: var(--accent); box-shadow: 0 0 0 2px rgba(37,99,235,.3); }
  .card.selected .card-select { background: var(--accent); border-color: var(--accent); color: #fff; }
  .card.selected .annotated-mark { display: none; }
  .mini-btn {
    width: 32px; height: 32px; border: none; border-radius: 8px;
    background: rgba(255,255,255,.92); backdrop-filter: blur(4px);
    box-shadow: 0 1px 4px rgba(0,0,0,.15);
    display: inline-flex; align-items: center; justify-content: center;
    color: var(--text-2); cursor: pointer; transition: color .15s, background .15s;
  }
  .mini-btn:hover { color: var(--accent); background: #fff; }
  .mini-btn svg { width: 17px; height: 17px; }
  @media (max-width: 640px) { .hover-actions { display: none; } }

  /* ---------- 批量选择底部操作栏 ---------- */
  .select-bar {
    position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%);
    display: flex; align-items: center; gap: 12px;
    background: #1e293b; color: #fff;
    padding: 9px 12px 9px 18px; border-radius: 999px;
    box-shadow: 0 10px 28px rgba(0,0,0,.3); z-index: 60;
    font-size: 14px; white-space: nowrap;
  }
  .select-bar[hidden] { display: none; }
  .select-bar .sb-count { color: #cbd5e1; }
  .select-bar .sb-count b { color: #fff; font-size: 15px; }
  .select-bar .sb-size { color: #cbd5e1; font-size: 12px; }
  .select-bar .sb-size b { color: #fff; font-size: 13px; }
  .select-bar button {
    border: none; border-radius: 999px; padding: 7px 16px;
    font-size: 13.5px; font-weight: 600; cursor: pointer;
    font-family: inherit;
  }
  #selectGroupBtn { background: var(--accent); color: #fff; }
  #selectGroupBtn:hover { background: #1d4ed8; }
  #selectClearBtn { background: transparent; color: #cbd5e1; }
  #selectClearBtn:hover { color: #fff; }
  @media (max-width: 640px) { .select-bar { bottom: 14px; gap: 8px; padding: 8px 10px 8px 14px; } }

  /* ---------- Group view ---------- */
  .group-view { padding-bottom: 24px; }
  .group-toolbar {
    display: flex; align-items: center; justify-content: space-between;
    padding: 12px 0; gap: 10px;
  }
  .group-toolbar h2 { font-size: 16px; font-weight: 700; }
  .group-toolbar .hint { font-size: 12px; color: var(--text-2); }
  .primary-btn {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 8px 16px; border: none; border-radius: 10px; cursor: pointer;
    background: var(--accent); color: #fff; font-size: 14px; font-weight: 600;
    transition: background .15s;
  }
  .primary-btn:hover { background: var(--accent-2); }
  .primary-btn svg { width: 16px; height: 16px; }
  .group-card {
    background: var(--card); border: 1px solid var(--border);
    border-radius: var(--radius); margin-bottom: 14px; overflow: hidden;
  }
  .group-head {
    display: flex; align-items: center; gap: 10px;
    padding: 13px 16px; cursor: pointer; user-select: none;
  }
  .group-head:hover { background: rgba(100,116,139,.05); }
  .group-chevron {
    width: 22px; height: 22px; flex-shrink: 0;
    display: inline-flex; align-items: center; justify-content: center;
    color: var(--text-2); transition: transform .2s;
  }
  .group-card.open .group-chevron { transform: rotate(90deg); }
  .group-chevron svg { width: 16px; height: 16px; }
  .group-name { font-size: 15px; font-weight: 700; flex-shrink: 0; }
  .group-note {
    font-size: 12px; color: var(--text-2); flex: 1; min-width: 0;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .group-count {
    flex-shrink: 0; font-size: 12px; font-weight: 600;
    background: rgba(100,116,139,.12); color: var(--text-2);
    padding: 2px 10px; border-radius: 999px;
  }
  .group-ops { display: flex; gap: 2px; flex-shrink: 0; }
  .group-ops .icon-btn { width: 30px; height: 30px; }
  .group-body { padding: 0 16px 16px; }
  .group-card:not(.open) .group-body { display: none; }
  .group-empty {
    text-align: center; color: var(--text-2); font-size: 13px;
    padding: 18px 0 6px;
  }

  /* ---------- Modal / popover ---------- */
  .modal-mask {
    position: fixed; inset: 0; z-index: 70;
    background: rgba(0,0,0,.4); backdrop-filter: blur(2px);
    display: none; align-items: center; justify-content: center; padding: 20px;
  }
  .modal-mask.open { display: flex; }
  .modal {
    background: var(--card); border-radius: 14px; width: 100%; max-width: 380px;
    box-shadow: 0 16px 48px rgba(0,0,0,.25);
    display: flex; flex-direction: column; max-height: 80vh;
  }
  .modal header {
    position: static;
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 16px; border-bottom: 1px solid var(--border);
  }
  .modal header h3 { font-size: 15px; font-weight: 700; }
  .modal .mbody { padding: 14px 16px; overflow-y: auto; }
  .modal .mfoot {

  .form-row { margin-bottom: 12px; }

    width: 100%; padding: 8px 10px; font-size: 14px;
    border: 1px solid var(--border); border-radius: 8px;

  .form-row select:focus { outline: none; border-color: var(--accent); }

  .upload-file-item .uf-size { color: var(--text-2); font-size: 12px; flex-shrink: 0; }
  .upload-file-empty { font-size: 12px; color: var(--text-2); margin-top: 8px; }

  .mini-btn.danger:hover { color: #dc2626; background: #fee2e2; }
  .group-pick-list { display: flex; flex-direction: column; gap: 2px; }

    display: flex; align-items: center; gap: 10px;

    transition: background .12s;
  }
  .group-pick:hover { background: rgba(100,116,139,.08); }
  .group-pick .g-icon {
    width: 32px; height: 32px; flex-shrink: 0; border-radius: 8px;
    background: rgba(37,99,235,.1); color: var(--accent);

  }
  .group-pick .g-meta { flex: 1; min-width: 0; }

  .group-pick .g-meta .d { font-size: 12px; color: var(--text-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .group-pick .check {
    width: 20px; height: 20px; flex-shrink: 0; border-radius: 6px;
    border: 2px solid var(--border); display: inline-flex; align-items: center; justify-content: center;
    color: transparent; font-size: 13px; font-weight: 700;
  }
  .group-pick.in .check { background: var(--accent); border-color: var(--accent); color: #fff; }
  .new-group-inline {
    margin-top: 8px; display: flex; gap: 8px;
  }
  .new-group-inline input {
    flex: 1; padding: 8px 10px; font-size: 14px;
    border: 1px solid var(--border); border-radius: 8px; background: var(--card); color: var(--text);
  }
  .new-group-inline input:focus { outline: none; border-color: var(--accent); }

  /* ---------- Annotation drawer ---------- */
  .drawer-mask {
    position: fixed; inset: 0; z-index: 50;
    background: rgba(0,0,0,.35); backdrop-filter: blur(2px);
    opacity: 0; visibility: hidden; transition: opacity .2s;
  }
  .drawer-mask.open { opacity: 1; visibility: visible; }
  .drawer {
    position: fixed; top: 0; right: 0; bottom: 0; z-index: 51;
    width: 100%; max-width: 420px;
    background: var(--card);
    box-shadow: -8px 0 28px rgba(0,0,0,.18);
    transform: translateX(100%);
    transition: transform .25s ease;
    display: flex; flex-direction: column;
  }
  .drawer.open { transform: translateX(0); }
  .drawer header {
    position: static; display: flex; align-items: center; justify-content: space-between;
    padding: 16px; border-bottom: 1px solid var(--border);
  }
  .drawer header h2 { font-size: 16px; font-weight: 600; }
  .drawer .file-info {
    padding: 14px 16px; border-bottom: 1px solid var(--border); background: var(--bg);
    display: flex; gap: 12px; align-items: center;
  }
  .drawer .file-info .ficon {
    width: 46px; height: 46px; flex-shrink: 0;

    display: flex; align-items: center; justify-content: center; font-size: 22px;
  }
  .drawer .file-info .fname { font-weight: 600; font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .drawer .file-info .fpath { font-size: 12px; color: var(--text-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .drawer .edit-area { flex: 1; padding: 16px; display: flex; flex-direction: column; gap: 8px; overflow-y: auto; }
  .drawer label { font-size: 13px; font-weight: 600; }
  .drawer label kbd {
    margin-left: 6px; padding: 1px 6px; font-size: 11px; font-weight: 500;
    background: var(--bg); border: 1px solid var(--border); border-radius: 4px;
    color: var(--text-2); font-family: inherit;
  }
  .drawer textarea {
    flex: 1; resize: none; padding: 12px; min-height: 180px;
    border: 1px solid var(--border); border-radius: 10px;
    background: var(--card); color: var(--text); font-size: 14px; line-height: 1.6;
    font-family: inherit;
  }
  .drawer textarea:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px rgba(37,99,235,.15); }
  .drawer .hint { font-size: 12px; color: var(--text-2); }
  .drawer footer {
    display: flex; gap: 10px; padding: 14px 16px; border-top: 1px solid var(--border);
  }
  .drawer footer button {
    flex: 1; padding: 10px; border: none; border-radius: 10px;
    font-size: 14px; font-weight: 600; cursor: pointer; transition: filter .15s;
  }
  .btn-close { background: var(--bg); color: var(--text); }
  .btn-close:hover { filter: brightness(.96); }
  .btn-save { background: var(--accent); color: #fff; }
  .btn-save:hover { background: var(--accent-2); }
  .drawer footer button:disabled { opacity: .6; cursor: not-allowed; }

  /* ---------- Footer (mobile) ---------- */
  footer.footer {
    position: sticky; bottom: 0; z-index: 10;
    display: none;
    background: var(--card); border-top: 1px solid var(--border);
    padding: 10px 16px; font-size: 12px; color: var(--text-2);
    justify-content: space-between; align-items: center;
  }
  @media (max-width: 640px) { footer.footer { display: flex; } }
  .footer-upload {
    display: inline-flex; align-items: center; gap: 5px;
    background: var(--accent); color: #fff; border: none;
    padding: 6px 14px; border-radius: 999px; font-size: 12px; font-weight: 600; cursor: pointer;
  }
  .footer-upload svg { width: 14px; height: 14px; }
</style>

<header>

          <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>

  var CATEGORIES = [
    { key: 'image', label: '图片', icon: '🖼️' },
    { key: 'video', label: '视频', icon: '🎬' },
    { key: 'document', label: '文档', icon: '📄' },
    { key: 'code', label: '代码', icon: '💻' },
    { key: 'archive', label: '压缩包', icon: '📦' },
    { key: 'app', label: '软件', icon: '💿' },
    { key: 'other', label: '其他', icon: '📎' }
  ]

  // 扩展名 → 分类 / 图标
  var EXT_CATEGORY = {
    image: ['jpg','jpeg','png','gif','webp','bmp','svg','heic'],
    video: ['mp4','mov','avi','mkv','flv','wmv','m4v','webm'],
    document: ['pdf','doc','docx','xls','xlsx','ppt','pptx','txt','md','rtf'],
    code: ['js','ts','vue','py','java','cpp','c','go','rs','html','css','json','xml','yaml','yml','sh','sql'],
    archive: ['zip','rar','7z','tar','gz','bz2','xz'],
    app: [
      // Windows
      'exe','msi','msix','appx','bat','cmd','com','scr','ps1','dll','ocx','cpl',
      // Linux
      'deb','rpm','appimage','run','flatpak','flatpakref','snap','elf',
      // macOS
      'app','dmg','pkg',
      // Android
      'apk','aab','xapk',
      // iOS
      'ipa',
      // 通用可执行 / 安装包
      'jar','bin'
    ]
  }
  function getCategoryByExt (name) {
    var ext = (name.split('.').pop() || '').toLowerCase()
    for (var k in EXT_CATEGORY) {
      if (EXT_CATEGORY[k].indexOf(ext) !== -1) return k
    }
    return 'other'
  }

  var CAT_LABEL = {}
  CATEGORIES.forEach(function (c) { CAT_LABEL[c.key] = c.label })

  /* 状态 */
  var state = {
    files: FILES.map(function (f) { return Object.assign({}, f) }),  // fallback 用 demo mock
    groups: [],
    folders: [],
    current: 'all',
    view: 'category',
    query: '',
    selected: null,
    collapsed: {},
    notes: [],
    notesCollapsed: false,
    selectedIds: {},  // 批量选择：{ [fileId]: true }
    demoMode: true  // 真实后端连上后切换为 false
  }

  /* ---------- localStorage 持久化 ---------- */
  var LS_ANNO = 'lan_share_annotations'
  var LS_GROUPS = 'lan_share_groups'
  var LS_FOLDERS = 'lan_share_folders'
  var LS_ORDER = 'lan_share_file_order'
  var LS_GROUP_ORDER = 'lan_share_group_order'
  var LS_NOTES = 'lan_share_notes'
  var LS_NOTES_COLLAPSED = 'lan_share_notes_collapsed'
  try {
    var savedAnno = localStorage.getItem(LS_ANNO)
    if (savedAnno) {
      var map = JSON.parse(savedAnno)
      state.files.forEach(function (f) { if (map[f.id] !== undefined) f.annotation = map[f.id] })
    }
    var savedGroups = localStorage.getItem(LS_GROUPS)
    if (savedGroups) {
      state.groups = JSON.parse(savedGroups)
    } else {
      // 第一次使用，预置两个分组示例
      state.groups = [
        { id: 'g1', name: '装修项目', note: '家装相关素材，给设计师参考', files: ['1', '13', '3'] },
        { id: 'g2', name: '工作交付', note: '正式交付客户 / 领导的文件', files: ['6', '14', '15', '24'] }
      ]
      saveGroups()
    }
    var savedFolders = localStorage.getItem(LS_FOLDERS)
    if (savedFolders) state.folders = JSON.parse(savedFolders)
    var savedOrder = localStorage.getItem(LS_ORDER)
    if (savedOrder) {
      var orderIds = JSON.parse(savedOrder)
      if (Array.isArray(orderIds) && orderIds.length) {
        var pos = {}
        orderIds.forEach(function (id, i) { pos[id] = i })
        state.files.sort(function (a, b) {
          var ia = pos[a.id], ib = pos[b.id]
          if (ia === undefined && ib === undefined) return 0
          if (ia === undefined) return 1
          if (ib === undefined) return -1
          return ia - ib
        })
      }
    }
    var savedGroupOrder = localStorage.getItem(LS_GROUP_ORDER)
    if (savedGroupOrder) {
      var gord = JSON.parse(savedGroupOrder)
      if (Array.isArray(gord) && gord.length) {
        var gpos = {}
        gord.forEach(function (id, i) { gpos[id] = i })
        state.groups.sort(function (a, b) {
          var ia = gpos[a.id], ib = gpos[b.id]
          if (ia === undefined && ib === undefined) return 0
          if (ia === undefined) return 1
          if (ib === undefined) return -1
          return ia - ib
        })
      }
    }
    var savedNotes = localStorage.getItem(LS_NOTES)
    if (savedNotes) {
      var ns = JSON.parse(savedNotes)
      if (Array.isArray(ns)) state.notes = ns
    }
    if (localStorage.getItem(LS_NOTES_COLLAPSED) === '1') state.notesCollapsed = true
  } catch (e) { /* ignore */ }

  function persistAnnotations () {
    try {
      var map = {}
      state.files.forEach(function (f) { map[f.id] = f.annotation })
      localStorage.setItem(LS_ANNO, JSON.stringify(map))
    } catch (e) { /* ignore */ }
  }
  function saveGroups () {
    if (state.demoMode) {
      try { localStorage.setItem(LS_GROUPS, JSON.stringify(state.groups)) } catch (e) { /* ignore */ }
      return
    }
    // 全量 diff 同步到后端：新增 POST、变化 PATCH、缺失 DELETE
    fetch('/api/groups').then(function (r) { return r.json() }).then(async function (d) {
      var serverGroups = (d && d.groups) || []
      // 1) 删除后端有、本地无的分组
      for (var i = 0; i < serverGroups.length; i++) {
        var sg = serverGroups[i]
        if (!state.groups.some(function (g) { return g.id === sg.id })) {
          await fetch('/api/groups/' + sg.id, { method: 'DELETE' })
        }
      }
      // 2) 新增 / 更新
      for (var j = 0; j < state.groups.length; j++) {
        var g = state.groups[j]
        var existing = serverGroups.filter(function (x) { return x.id === g.id })[0]
        if (existing) {
          await fetch('/api/groups/' + g.id, {
            method: 'PATCH',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ name: g.name, note: g.note, files: g.files })
          })
        } else {
          var r2 = await fetch('/api/groups', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ name: g.name, note: g.note })
          })
          var nd = await r2.json()
          if (nd.ok && nd.id) {
            g.id = nd.id  // 用后端真实 id 替换本地临时 id
            await fetch('/api/groups/' + g.id, {
              method: 'PATCH',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ name: g.name, note: g.note, files: g.files })
            })
          }
        }
      }
    }).catch(function () {})
  }
  function saveFolders (cb) {
    if (state.demoMode) {
      try { localStorage.setItem(LS_FOLDERS, JSON.stringify(state.folders)) } catch (e) { /* ignore */ }
      if (cb) cb()
      return
    }
    fetch('/api/config', {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ shareFolders: state.folders })
    }).then(function (r) { return r.json() }).then(function (d) {
      if (d.ok) { showToast('配置已保存'); if (cb) cb() }
      else { showToast('保存失败'); state.folders = state.folders.slice(0, -1); if (cb) cb() }
    }).catch(function () { showToast('保存失败，后端不可达'); if (cb) cb() })
  }

  function reloadFiles () {
    fetch('/api/files').then(function (r) { return r.json() }).then(function (d) {
      if (d && d.files) {
        state.files = d.files.map(function (f) {
          return { id: f.id, name: f.name, path: f.relPath, category: f.category,
            size: f.size, modifiedAt: f.mtime, thumb: '', annotation: f.annotation || '' }
        })
        state.folders = d.folders ? d.folders.map(function (f) { return f.path }) : state.folders
        renderFolderStrip()
        renderViews()
      }
    }).catch(function () {})
  }
  function saveFileOrder () {
    try { localStorage.setItem(LS_ORDER, JSON.stringify(state.files.map(function (f) { return f.id }))) } catch (e) { /* ignore */ }
  }
  function saveGroupOrder () {
    try { localStorage.setItem(LS_GROUP_ORDER, JSON.stringify(state.groups.map(function (g) { return g.id }))) } catch (e) { /* ignore */ }
  }
  function groupsOfFile (fileId) {
    return state.groups.filter(function (g) { return g.files.indexOf(fileId) !== -1 })
  }

  /* ---------- utils ---------- */
  function formatSize (bytes) {
    if (bytes < 1024) return bytes + ' B'
    if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB'
    if (bytes < 1024 * 1024 * 1024) return (bytes / 1024 / 1024).toFixed(1) + ' MB'
    return (bytes / 1024 / 1024 / 1024).toFixed(1) + ' GB'
  }

  function formatTime (ts) {
    var diff = Date.now() - ts
    if (diff < 60 * 1000) return '刚刚'
    if (diff < 60 * 60 * 1000) return Math.floor(diff / 60000) + ' 分钟前'
    if (diff < 24 * 60 * 60 * 1000) return Math.floor(diff / 3600000) + ' 小时前'
    if (diff < 7 * 24 * 60 * 60 * 1000) return Math.floor(diff / 86400000) + ' 天前'
    var d = new Date(ts)
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0')
  }

  function countByCategory () {
    var counts = {}
    state.files.forEach(function (f) { counts[f.category] = (counts[f.category] || 0) + 1 })
    return counts
  }

  function filteredFiles () {
    var q = state.query.trim().toLowerCase()
    return state.files.filter(function (f) {
      if (state.current !== 'all' && f.category !== state.current) return false
      if (!q) return true
      return f.name.toLowerCase().indexOf(q) !== -1 ||
             f.annotation.toLowerCase().indexOf(q) !== -1
    })
  }

  function iconFor (cat) {
    return { image: '🖼️', video: '🎬', document: '📄', code: '💻', archive: '📦', app: '💿', other: '📎' }[cat] || '📎'
  }

  /* ---------- render ---------- */
  var tabList = document.getElementById('tabList')
  var grid = document.getElementById('fileGrid')
  var empty = document.getElementById('emptyState')
  var statsBar = document.getElementById('statsBar')
  var footerCount = document.getElementById('footerCount')
  var categoryView = document.getElementById('categoryView')
  var groupView = document.getElementById('groupView')
  var groupEmpty = document.getElementById('groupEmpty')

  function renderTabs () {
    var counts = countByCategory()
    tabList.innerHTML = ''

    // 全部 tab
    var allBtn = document.createElement('button')
    var allActive = state.view === 'category' && state.current === 'all'
    allBtn.className = 'tab' + (allActive ? ' active' : '')
    allBtn.setAttribute('role', 'tab')
    allBtn.setAttribute('aria-selected', allActive ? 'true' : 'false')
    allBtn.innerHTML = '<span>🗂️</span> <span>全部</span>' +
      ' <span class="tab-count">' + state.files.length + '</span>'
    allBtn.addEventListener('click', function () {
      state.view = 'category'
      state.current = 'all'
      renderViews()
    })
    tabList.appendChild(allBtn)

    CATEGORIES.forEach(function (c) {
      var btn = document.createElement('button')
      btn.className = 'tab' + (state.view === 'category' && c.key === state.current ? ' active' : '')
      btn.setAttribute('role', 'tab')
      btn.setAttribute('aria-selected', state.view === 'category' && c.key === state.current ? 'true' : 'false')
      btn.innerHTML = '<span>' + c.icon + '</span> <span>' + c.label + '</span>' +
        ' <span class="tab-count">' + (counts[c.key] || 0) + '</span>'
      btn.addEventListener('click', function () {
        state.view = 'category'
        state.current = c.key
        renderViews()
      })
      tabList.appendChild(btn)
    })

    // 分组 tab
    var sep = document.createElement('span')
    sep.className = 'tab-sep'
    tabList.appendChild(sep)
    var gBtn = document.createElement('button')
    gBtn.className = 'tab' + (state.view === 'group' ? ' active' : '')
    gBtn.setAttribute('role', 'tab')
    gBtn.setAttribute('aria-selected', state.view === 'group' ? 'true' : 'false')
    gBtn.innerHTML = '<span>🧷</span> <span>分组</span>' +
      ' <span class="tab-count">' + state.groups.length + '</span>'
    gBtn.addEventListener('click', function () {
      state.view = 'group'
      renderViews()
    })
    tabList.appendChild(gBtn)

    var groupTb = document.getElementById('groupToggleBtn')
    groupTb.classList.toggle('highlight', state.view === 'group')
  }

  // 右上角「分组视图」：在分类视图与分组视图之间切换
  document.getElementById('groupToggleBtn').addEventListener('click', function () {
    state.view = state.view === 'group' ? 'category' : 'group'
    renderViews()
  })

  /* ---------- 数据统计看板 ---------- */
  function renderStats () {
    var totalBytes = 0
    var byCat = {}
    CATEGORIES.forEach(function (c) { byCat[c.key] = { count: 0, bytes: 0 } })
    state.files.forEach(function (f) {
      var k = byCat[f.category] ? f.category : 'other'
      byCat[k].count++
      byCat[k].bytes += f.size || 0
      totalBytes += f.size || 0
    })
    var html = '<span class="stat-pill main">共 <b>' + state.files.length + '</b> 个文件 · ' +
      formatSize(totalBytes) + '</span>'
    CATEGORIES.forEach(function (c) {
      var s = byCat[c.key]
      if (s.count > 0) {
        html += '<span class="stat-pill cat-pill">' + c.icon + ' <b>' + s.count + '</b> · ' + formatSize(s.bytes) + '</span>'
      }
    })
    statsBar.innerHTML = html
  }

  function renderViews () {
    renderStats()
    renderTabs()
    if (state.view === 'group') {
      categoryView.hidden = true
      groupView.hidden = false
      renderGroups()
    } else {
      groupView.hidden = true
      categoryView.hidden = false
      renderGrid()
    }
  }

  /* ---------- 卡片 ---------- */
  function playSvg () {
    return '<svg fill="currentColor" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>'
  }
  function annotateSvg () {
    return '<svg fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"/></svg>'
  }
  function eyeSvg () {
    return '<svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/><path stroke-linecap="round" stroke-linejoin="round" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/></svg>'
  }
  function downloadSvg () {
    return '<svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/></svg>'
  }
  function trashSvg () {
    return '<svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>'
  }
  function groupSvg () {
    return '<svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M17 14v6m-3-3h6M6 10h2a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v2a2 2 0 002 2zm10 0h2a2 2 0 002-2V6a2 2 0 00-2-2h-2a2 2 0 00-2 2v2a2 2 0 002 2zM6 20h2a2 2 0 002-2v-2a2 2 0 00-2-2H6a2 2 0 00-2 2v2a2 2 0 002 2z"/></svg>'
  }
  function checkSvg () {
    return '<svg fill="none" stroke="currentColor" stroke-width="3" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"/></svg>'
  }

  function fileUrl (file) {
    return '/files/' + file.id.split('/').map(encodeURIComponent).join('/')
  }

  function openPreview (file) {
    window.open(fileUrl(file), '_blank')
  }

  function buildCard (file) {
    var card = document.createElement('article')
    var checked = !!state.selectedIds[file.id]
    card.className = 'card cat-' + file.category + (checked ? ' selected' : '')
    card.setAttribute('role', 'button')
    card.setAttribute('tabindex', '0')
    card.setAttribute('draggable', 'true')
    card.setAttribute('data-id', file.id)
    card.setAttribute('aria-label', file.name + '，' + formatSize(file.size) + '，' + formatTime(file.modifiedAt))

    var selectHtml = '<button class="card-select" data-select type="button" role="checkbox" aria-checked="' +
      (checked ? 'true' : 'false') + '" aria-label="选择此文件" title="选择并加入分组">' + checkSvg() + '</button>'

    var isImage = file.category === 'image'
    var isVideo = file.category === 'video'
    var hasThumb = file.thumb && (isImage || isVideo)
    var thumbHtml
    if (isImage) {
      var img = '<img src="' + fileUrl(file) + '" alt="' + file.name + '" loading="lazy" onerror="this.parentNode.classList.add(\'plain\'); this.parentNode.innerHTML=' +
        '\'<div class=&quot;icon&quot;>&#128444;</div><span class=&quot;ext-label&quot;>' + (file.name.split('.').pop() || 'file') + '</span>\';">'
      thumbHtml = '<div class="thumb">' + img +
        '<span class="cat-badge">' + CAT_LABEL[file.category] + '</span></div>'
    } else if (hasThumb) {
      var img2 = '<img src="' + file.thumb + '" alt="' + file.name + '" loading="lazy">'
      var overlay = isVideo
        ? '<div class="play-overlay">' + playSvg() + '</div>'
        : ''
      thumbHtml = '<div class="thumb">' + img2 + overlay +
        '<span class="cat-badge">' + CAT_LABEL[file.category] + '</span></div>'
    } else {
      thumbHtml = '<div class="thumb plain">' +
        '<div class="icon">' + iconFor(file.category) + '</div>' +
        '<span class="ext-label">' + (file.name.split('.').pop() || 'file') + '</span>' +
        '<span class="cat-badge">' + CAT_LABEL[file.category] + '</span></div>'
    }

    var groupsHtml = ''
    var myGroups = groupsOfFile(file.id)
    if (myGroups.length) {
      groupsHtml = '<div style="display:flex;gap:4px;margin-top:6px;flex-wrap:wrap">' +
        myGroups.map(function (g) {
          return '<span style="font-size:11px;background:rgba(37,99,235,.1);color:var(--accent);padding:1px 8px;border-radius:999px">🧷 ' + g.name + '</span>'
        }).join('') +
        '</div>'
    }

    var markHtml = ''
    if (file.annotation) {
      markHtml = '<span class="annotated-mark">' + annotateSvg() + '备注</span>'
    }

    var noteHtml = ''
    if (file.annotation) {
      noteHtml = '<div class="card-note">' + file.annotation + '</div>'
    }

    var hoverHtml =
      '<div class="hover-actions">' +
        '<button class="mini-btn" data-act="group" aria-label="分组">' + groupSvg() + '</button>' +
        '<button class="mini-btn" data-act="preview" aria-label="预览">' + eyeSvg() + '</button>' +
        '<button class="mini-btn" data-act="download" aria-label="下载">' + downloadSvg() + '</button>' +
        '<button class="mini-btn danger" data-act="delete" aria-label="删除" title="从硬盘永久删除">' + trashSvg() + '</button>' +
      '</div>'

    card.innerHTML = selectHtml + thumbHtml + markHtml + hoverHtml +
      '<div class="card-body">' +
        '<div class="card-name">' + file.name + '</div>' +
        '<div class="card-meta"><span>' + formatSize(file.size) + '</span><span>' + formatTime(file.modifiedAt) + '</span></div>' +
        noteHtml +
        groupsHtml +
      '</div>'

    card.addEventListener('click', function (e) {
      var selBtn = e.target.closest('[data-select]')
      if (selBtn) {
        e.stopPropagation()
        toggleSelect(file.id, card)
        return
      }
      var actBtn = e.target.closest('[data-act]')
      if (actBtn) {
        e.stopPropagation()
        var act = actBtn.getAttribute('data-act')
        if (act === 'group') openGroupPick(file)
        else if (act === 'preview') openPreview(file)
        else if (act === 'delete') openDeleteConfirm(file)
        else {
          var a = document.createElement('a')
          a.href = fileUrl(file) + '?download=1'
          a.setAttribute('download', file.name)
          document.body.appendChild(a)
          a.click()
          a.remove()
        }
        return
      }
      // 批量选择模式下，点卡片其余区域也切换选中；否则打开详情
      if (e.target.closest('.card-select')) { toggleSelect(file.id, card); return }
      openDrawer(file)
    })
    card.addEventListener('keydown', function (e) {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openDrawer(file) }
    })
    return card
  }

  /* ---------- 批量选择 ---------- */
  var selectBar = document.getElementById('selectBar')
  var selectCount = document.getElementById('selectCount')

  function toggleSelect (id, cardEl) {
    if (state.selectedIds[id]) {
      delete state.selectedIds[id]
      if (cardEl) cardEl.classList.remove('selected')
    } else {
      state.selectedIds[id] = true
      if (cardEl) cardEl.classList.add('selected')
    }
    if (cardEl) {
      var b = cardEl.querySelector('[data-select]')
      if (b) b.setAttribute('aria-checked', state.selectedIds[id] ? 'true' : 'false')
    }
    updateSelectBar()
  }

  var selectSizeEl = document.getElementById('selectSize')

  function updateSelectBar () {
    var n = Object.keys(state.selectedIds).length
    selectBar.hidden = n === 0
    selectCount.textContent = String(n)
    var bytes = 0
    state.files.forEach(function (f) { if (state.selectedIds[f.id]) bytes += f.size || 0 })
    selectSizeEl.textContent = formatSize(bytes)
  }

  function clearSelection () {
    state.selectedIds = {}
    updateSelectBar()
    renderViews()
  }

  function selectedFileList () {
    return state.files.filter(function (f) { return state.selectedIds[f.id] })
  }

  document.getElementById('selectClearBtn').addEventListener('click', clearSelection)
  document.getElementById('selectGroupBtn').addEventListener('click', function () {
    var files = selectedFileList()
    if (!files.length) return
    openGroupPick(files)
  })

  function renderGrid () {
    var files = filteredFiles()
    grid.innerHTML = ''
    if (files.length === 0) {
      grid.style.display = 'none'
      empty.style.display = 'block'
    } else {
      grid.style.display = 'grid'
      empty.style.display = 'none'
      files.forEach(function (f) { grid.appendChild(buildCard(f)) })
    }
    footerCount.textContent = files.length + ' 个文件'
  }

  /* ---------- 拖拽排序 ---------- */
  var dragId = null
  function reorderList (arr, dragIdx, targetIdx) {
    var moved = arr.splice(dragIdx, 1)[0]
    arr.splice(targetIdx, 0, moved)
  }
  function setupFileDnD () {
    grid.addEventListener('dragstart', function (e) {
      var card = e.target.closest('.card')
      if (!card) return
      dragId = card.getAttribute('data-id')
      card.classList.add('dragging')
      try { e.dataTransfer.effectAllowed = 'move'; e.dataTransfer.setData('text/plain', dragId) } catch (err) {}
    })
    grid.addEventListener('dragover', function (e) {
      e.preventDefault()
      var card = e.target.closest('.card')
      if (card) {
        var over = grid.querySelectorAll('.card.drop-over')
        for (var i = 0; i < over.length; i++) over[i].classList.remove('drop-over')
        card.classList.add('drop-over')
      }
    })
    grid.addEventListener('dragleave', function (e) {
      var card = e.target.closest('.card')
      if (card) card.classList.remove('drop-over')
    })
    grid.addEventListener('drop', function (e) {
      e.preventDefault()
      grid.querySelectorAll('.card.drop-over').forEach(markRemoveCardClass)
      var target = e.target.closest('.card')
      if (dragId && target) {
        var targetId = target.getAttribute('data-id')
        var idxT = state.files.findIndex(function (f) { return f.id === targetId })
        var idxD = state.files.findIndex(function (f) { return f.id === dragId })
        if (idxT !== -1 && idxD !== -1 && idxD !== idxT) {
          // 在数组的真实顺序里重排：目标在当前视图中的位置保持
          var vis = filteredFiles()
          var tvis = vis.findIndex(function (f) { return f.id === targetId })
          var dvis = vis.findIndex(function (f) { return f.id === dragId })
          if (tvis !== -1) {
            if (dvis < tvis) {
              // 被拖文件原本在目标之前，保持就位（不做跨分类顺序调整）
              reorderList(state.files, idxD, idxT)
            } else {
              reorderList(state.files, idxD, idxT)
            }
          }
          saveFileOrder()
          renderViews()
        }
      }
      dragId = null
    })
    grid.addEventListener('dragend', function () {
      grid.querySelectorAll('.card').forEach(markRemoveCardClass)
      dragId = null
    })
  }
  function markRemoveCardClass (el) {
    el.classList.remove('drag-over-placeholder')
    el.classList.remove('drop-over')
    el.classList.remove('dragging')
  }
  function setupGroupDnD () {
    var list = document.getElementById('groupList')
    list.addEventListener('dragstart', function (e) {
      if (e.target.closest('.card')) return
      var gc = e.target.closest('.group-card')
      if (!gc) return
      dragId = gc.getAttribute('data-gid')
      gc.classList.add('dragging')
      try { e.dataTransfer.effectAllowed = 'move'; e.dataTransfer.setData('text/plain', dragId) } catch (err) {}
    })
    list.addEventListener('dragover', function (e) {
      e.preventDefault()
      var gc = e.target.closest('.group-card')
      if (gc) {
        var over = list.querySelectorAll('.group-card.drop-over')
        for (var i = 0; i < over.length; i++) over[i].classList.remove('drop-over')
        gc.classList.add('drop-over')
      }
    })
    list.addEventListener('dragleave', function (e) {
      var gc = e.target.closest('.group-card')
      if (gc) gc.classList.remove('drop-over')
    })
    list.addEventListener('drop', function (e) {
      e.preventDefault()
      if (!dragId || e.target.closest('.card')) { dragId = null; return }
      list.querySelectorAll('.group-card.drop-over').forEach(markRemoveCardClass)
      var target = e.target.closest('.group-card')
      if (dragId && target) {
        var targetId = target.getAttribute('data-gid')
        var idxT = state.groups.findIndex(function (g) { return g.id === targetId })
        var idxD = state.groups.findIndex(function (g) { return g.id === dragId })
        if (idxT !== -1 && idxD !== -1 && idxD !== idxT) {
          reorderList(state.groups, idxD, idxT)
          saveGroupOrder()
          renderViews()
        }
      }
      dragId = null
    })
    list.addEventListener('dragend', function () {
      list.querySelectorAll('.group-card').forEach(markRemoveCardClass)
      dragId = null
    })
  }

  /* ---------- 分组视图 ---------- */
  function chevronSvg () {
    return '<svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7"/></svg>'
  }
  function editSvg () {
    return '<svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M16.862 4.487l1.687-1.688a1.875 1.875 0 112.652 2.652L10.582 16.07a4.5 4.5 0 01-1.897 1.13L6 18l.8-2.685a4.5 4.5 0 011.13-1.897l8.932-8.931zm0 0L19.5 7.125"/></svg>'
  }

  function renderGroups () {
    var list = document.getElementById('groupList')
    list.innerHTML = ''
    if (state.groups.length === 0) {
      groupEmpty.style.display = 'block'
      return
    }
    groupEmpty.style.display = 'none'

    state.groups.forEach(function (g) {
      var card = document.createElement('article')
      card.className = 'group-card' + (state.collapsed[g.id] ? '' : ' open')
      card.setAttribute('draggable', 'true')
      card.setAttribute('data-gid', g.id)

      var head = document.createElement('div')
      head.className = 'group-head'
      head.innerHTML =
        '<span class="group-chevron">' + chevronSvg() + '</span>' +
        '<span class="group-name">' + g.name + '</span>' +
        '<span class="group-note">' + (g.note || '') + '</span>' +
        '<span class="group-count">' + g.files.length + ' 个文件</span>' +
        '<span class="group-ops">' +
          '<button class="icon-btn" data-gop="edit" aria-label="编辑分组">' + editSvg() + '</button>' +
          '<button class="icon-btn" data-gop="del" aria-label="删除分组">' +
            '<svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M7 7l.85 12.1A2 2 0 009.84 21h4.32a2 2 0 001.99-1.9L17 7M5 7h14m-9-3h4a1 1 0 011 1v1H8V5a1 1 0 011-1z"/></svg>' +
          '</button>' +
        '</span>'

      var body = document.createElement('div')
      body.className = 'group-body'
      if (g.files.length === 0) {
        body.innerHTML = '<div class="group-empty">这个分组还没有文件</div>'
      } else {
        var inner = document.createElement('div')
        inner.className = 'grid'
        inner.style.cssText = 'grid-template-columns:repeat(auto-fill,minmax(160px,1fr))'
        g.files.forEach(function (fid) {
          var f = state.files.find(function (x) { return x.id === fid })
          if (f) inner.appendChild(buildCard(f))
        })
        body.appendChild(inner)
      }

      head.addEventListener('click', function (e) {
        if (e.target.closest('[data-gop]')) {
          var op = e.target.closest('[data-gop]').getAttribute('data-gop')
          if (op === 'edit') openGroupEdit(g)
          else if (op === 'del') {
            if (confirm('删除分组「' + g.name + '」？分组内文件不会被删除，只是离开分组。')) {
              state.groups = state.groups.filter(function (x) { return x.id !== g.id })
              saveGroups(); renderViews()
            }
          }
          return
        }
        if (state.collapsed[g.id]) delete state.collapsed[g.id]
        else state.collapsed[g.id] = true
        card.classList.toggle('open', !state.collapsed[g.id])
      })

      card.appendChild(head)
      card.appendChild(body)
      list.appendChild(card)
    })
  }

  /* ---------- 分组 Modal ---------- */
  var groupPickModal = document.getElementById('groupPickModal')
  var groupEditModal = document.getElementById('groupEditModal')
  var noteEditModal = document.getElementById('noteEditModal')
  var pickTargets = []  // 待加入分组的文件数组（单文件时长度为 1）

  function openModal (modal) { modal.classList.add('open') }
  function closeAllModals () {
    document.querySelectorAll('.modal-mask.open').forEach(function (m) { m.classList.remove('open') })
  }

  /** 把某个分组的最新状态持久化（批量加入时用，避免全量同步的开销） */
  function persistGroup (g) {
    if (state.demoMode) {
      try { localStorage.setItem(LS_GROUPS, JSON.stringify(state.groups)) } catch (e) { /* ignore */ }
      return
    }
    fetch('/api/groups/' + g.id, {
      method: 'PATCH',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name: g.name, note: g.note, files: g.files })
    }).catch(function () { /* 失败时下次全量同步会纠正 */ })
  }

  function groupPickRow (g) {
    var ids = pickTargets.map(function (f) { return f.id })
    var isBatch = pickTargets.length > 1
    var inCount = ids.filter(function (id) { return g.files.indexOf(id) !== -1 }).length
    var row = document.createElement('div')
    var inClass = isBatch ? (inCount > 0 && inCount === ids.length) : (inCount > 0)
    row.className = 'group-pick' + (inClass ? ' in' : '')
    var desc = isBatch
      ? ('含 ' + inCount + '/' + ids.length + ' 个选中文件')
      : (g.note || '无备注')
    row.innerHTML =
      '<span class="g-icon">🧷</span>' +
      '<span class="g-meta"><span class="t">' + g.name + '</span>' +
      '<span class="d">' + desc + '</span></span>' +
      '<span class="check">✓</span>'
    row.addEventListener('click', function () {
      if (isBatch) {
        // 批量：一次性把这批文件全部加入（已在组内的自动跳过）
        var added = 0
        ids.forEach(function (id) {
          if (g.files.indexOf(id) === -1) { g.files.push(id); added++ }
        })
        if (added === 0) { showToast('选中的文件都已在此分组'); return }
        persistGroup(g)
        row.classList.add('in')
        row.querySelector('.d').textContent = '含 ' + ids.length + '/' + ids.length + ' 个选中文件'
        if (state.view === 'group') renderGroups()
        showToast('已加入 ' + added + ' 个文件到「' + g.name + '」')
      } else {
        // 单文件：保持原来的勾选切换语义
        var file = pickTargets[0]
        var idx = g.files.indexOf(file.id)
        if (idx === -1) g.files.push(file.id)
        else g.files.splice(idx, 1)
        saveGroups()
        row.classList.toggle('in', idx === -1)
        if (state.view === 'category') renderGrid()
        else renderGroups()
        if (state.selected && state.selected.id === file.id) renderDrawerFile(file)
      }
    })
    return row
  }

  function loadUploadDirs () {
    uploadDirSelect.innerHTML = ''
    if (state.demoMode) {
      var opt = document.createElement('option')
      opt.value = 'demo'
      opt.textContent = '演示模式（不落盘）'
      uploadDirSelect.appendChild(opt)
      uploadDirHint.textContent = '演示模式不会真正保存文件'
      return Promise.resolve()
    }
    return fetch('/api/dirs').then(function (r) { return r.json() }).then(function (d) {
      var dirs = (d && d.dirs) || []
      if (!dirs.length) {
        uploadDirSelect.innerHTML = '<option value="">没有可用的共享文件夹</option>'
        uploadDirHint.textContent = '请先在设置里添加共享文件夹'
        return
      }
      dirs.forEach(function (item) {
        var o = document.createElement('option')
        o.value = item.value
        o.textContent = item.ok ? item.label : item.label + '（目录不存在）'
        if (!item.ok) o.disabled = true
        uploadDirSelect.appendChild(o)
      })
      var remembered = null
      try { remembered = localStorage.getItem('uploadDir') } catch (e) {}
      if (remembered && dirs.some(function (x) { return x.value === remembered && x.ok })) {
        uploadDirSelect.value = remembered
      }
      uploadDirHint.textContent = '文件会保存到：' + uploadDirSelect.value
    }).catch(function () {
      uploadDirSelect.innerHTML = '<option value="">无法获取目录列表</option>'
    })
  }

  uploadDirSelect.addEventListener('change', function () {
    uploadDirHint.textContent = '文件会保存到：' + uploadDirSelect.value
    try { localStorage.setItem('uploadDir', uploadDirSelect.value) } catch (e) {}

  function openUploadModal () {
    pendingFiles = []

    loadUploadDirs().then(function () { openModal(uploadModal) })
  }

  function handleFiles (fileList) {
    pendingFiles = Array.prototype.slice.call(fileList).map(function (f) {
      var rel = ''
      var wp = f.webkitRelativePath || ''
      var slash = wp.lastIndexOf('/')
      if (slash !== -1) rel = wp.slice(0, slash)
      return { file: f, rel: rel }
    })
    renderUploadFileList()
  }

  function doUpload () {
    if (!pendingFiles.length) { showToast('请先选择文件'); return }

    if (state.demoMode) {
      var addedDemo = 0
      var uidDemo = Date.now()
      for (var k = 0; k < pendingFiles.length; k++) {
        var fd = pendingFiles[k].file
        var relD = pendingFiles[k].rel || ''
        var pathD = relD ? '上传/' + relD + '/' + fd.name : '上传/' + fd.name
        var catD = getCategoryByExt(fd.name)
        var thumbD = catD === 'image' ? URL.createObjectURL(fd) : (catD === 'video' ? svgThumb('🎬', '#fcd34d', '#f59e0b') : '')
        state.files.push({
          id: 'u' + (uidDemo + k),
          name: fd.name,
          path: pathD,
          category: catD,
          size: fd.size,
          modifiedAt: Date.now(),
          thumb: thumbD,
          annotation: '',
          uploaded: true
        })
        addedDemo++
      }
      closeAllModals()
      pendingFiles = []
      if (addedDemo) {
        showToast('已上传 ' + addedDemo + ' 个文件（演示模式，刷新后还原）')
        if (state.view === 'group') renderViews()
        else { renderTabs(); renderGrid() }
      }
      return
    }

    var targetDir = uploadDirSelect.value
    if (!targetDir) { showToast('请先选择目标目录'); return }

    var files = pendingFiles.slice()
    var totalUp = files.length
    var doneUp = 0, failUp = 0, firstErr = ''
    uploadConfirmBtn.disabled = true
    uploadConfirmBtn.textContent = '上传中 0/' + totalUp

    files.forEach(function (f) {
      fetch('/api/upload', {
        method: 'POST',
        headers: {
          'X-File-Name': encodeURIComponent(f.file.name),
          'X-Upload-Dir': encodeURIComponent(targetDir),
          'X-Upload-Rel': encodeURIComponent(f.rel || '')
        },
        body: f.file
      }).then(function (r) { return r.json() }).then(function (d) {
        if (d && d.ok) doneUp++
        else { failUp++; if (d && d.error && !firstErr) firstErr = d.error }
      }).catch(function () {
        failUp++
      }).then(function () {
        var finished = doneUp + failUp
        uploadConfirmBtn.textContent = '上传中 ' + finished + '/' + totalUp
        if (finished === totalUp) afterUpload(doneUp, failUp, firstErr)
      })
    })
  }

  function afterUpload (okCount, failCount, firstErr) {
    uploadConfirmBtn.disabled = false
    uploadConfirmBtn.textContent = '上传'
    if (okCount > 0) {
      closeAllModals()
      pendingFiles = []
      renderUploadFileList()
      showToast('上传完成：' + okCount + ' 个成功' +
        (failCount > 0 ? '，' + failCount + ' 个失败' + (firstErr ? '（' + firstErr + '）' : '') : ''))
    } else {
      showToast('上传失败' + (firstErr ? '：' + firstErr : '，后端不可达'))
    }
    reloadFiles()
  }

  }

  function renderNoteWall () {
    noteWall.classList.toggle('collapsed', !!state.notesCollapsed)
    noteCount.textContent = state.notes.length ? state.notes.length + ' 张' : '随手记两笔'
    noteGrid.innerHTML = ''
    if (!state.notes.length) {
      var empty = document.createElement('div')
      empty.className = 'note-empty'
      empty.textContent = state.notesCollapsed ? '' : '还没有便利贴，点右上角「记一张」写下随手要记的内容（网址、灵感、待办…）'
      noteGrid.appendChild(empty)
      return
    }
    state.notes.forEach(function (n) {
      var card = document.createElement('div')
      card.className = 'note ' + (n.color || 'yellow')
      card.setAttribute('data-note-id', n.id)
      var t = new Date(n.created)
      var tstr = t.getFullYear() + '-' + String(t.getMonth() + 1).padStart(2, '0') + '-' + String(t.getDate()).padStart(2, '0') + ' ' + String(t.getHours()).padStart(2, '0') + ':' + String(t.getMinutes()).padStart(2, '0')
      card.innerHTML =
        '<div class="note-ops">' +
          '<button data-note-edit title="编辑" aria-label="编辑便利贴">' +
            '<svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M16.862 4.487l1.687-1.688a1.875 1.875 0 112.652 2.652L6.832 19.82a4.5 4.5 0 01-1.897 1.13l-2.685.8.8-2.685a4.5 4.5 0 011.13-1.897L16.862 4.487z"/></svg>' +
          '</button>' +
          '<button data-note-del title="删除" aria-label="删除便利贴">' +
            '<svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/></svg>' +
          '</button>' +
        '</div>' +
        '<div class="note-body">' + n.html + '</div>' +
        '<div class="note-time">' + tstr + '</div>'
      card.querySelector('[data-note-edit]').addEventListener('click', function () { openNoteEditor(n.id) })
      card.querySelector('[data-note-del]').addEventListener('click', function () {
        var id = n.id
        serverDeleteNote(id).then(function (ok) {
          state.notes = state.notes.filter(function (x) { return x.id !== id })
          saveNotes()
          renderNoteWall()
          showToast(ok ? '便利贴已删除' : '删除失败')
        })
      })
      noteGrid.appendChild(card)
    })
  }

  function resetNoteEditor () {
    editingNoteId = null
    noteEditor.innerHTML = ''
    document.querySelectorAll('#noteColors .note-color').forEach(function (b) {
      b.classList.toggle('active', b.getAttribute('data-color') === 'yellow')
    })
  }

  function openNoteEditor (id) {
    var n = null
    if (id) n = state.notes.filter(function (x) { return x.id === id })[0]
    editingNoteId = id || null
    noteEditTitle.textContent = id ? '编辑便利贴' : '记一张便利贴'
    noteEditor.innerHTML = n ? n.html : ''
    document.querySelectorAll('#noteColors .note-color').forEach(function (b) {
      b.classList.toggle('active', n ? (b.getAttribute('data-color') === n.color) : (b.getAttribute('data-color') === 'yellow'))
    })
    noteEditModal.classList.add('open')
    noteEditor.focus()
  }

  document.getElementById('noteWallToggle').addEventListener('click', function (e) {
    if (e.target.closest('.nw-add')) return
    state.notesCollapsed = !state.notesCollapsed
    try { localStorage.setItem(LS_NOTES_COLLAPSED, state.notesCollapsed ? '1' : '0') } catch (err) {}
    renderNoteWall()
  })
  document.getElementById('noteAddBtn').addEventListener('click', function (e) {
    e.stopPropagation()
    resetNoteEditor()
    noteEditModal.classList.add('open')
    noteEditor.focus()
  })
  document.getElementById('noteSaveBtn').addEventListener('click', function () {
    var html = noteEditor.innerHTML.trim()
    if (!html || html === '<br>' || html === '<div><br></div>') { showToast('先写点内容再保存'); return }
    var color = (document.querySelector('#noteColors .note-color.active') || {}).getAttribute && document.querySelector('#noteColors .note-color.active').getAttribute('data-color') || 'yellow'
    var editingId = editingNoteId
    var created = Date.now()
    serverSaveNote(editingId, html, color, created).then(function (okSrv) {
      if (editingId) {
        var n = state.notes.filter(function (x) { return x.id === editingId })[0]
        if (n) { n.html = html; n.color = color }
      } else {
        state.notes.unshift({
          id: 'n' + created,
          html: html,
          color: color,
          created: created
        })
      }
      saveNotes()
      if (state.notesCollapsed) {
        state.notesCollapsed = false
        try { localStorage.setItem(LS_NOTES_COLLAPSED, '0') } catch (err) {}
      }
      renderNoteWall()
      noteEditModal.classList.remove('open')
      showToast(editingId ? '便利贴已更新' : (okSrv === false ? '保存失败' : '已记下一张便利贴'))
      editingNoteId = null
    })
  })
  document.querySelectorAll('#noteColors .note-color').forEach(function (b) {
    b.addEventListener('click', function () {
      document.querySelectorAll('#noteColors .note-color').forEach(function (x) { x.classList.remove('active') })
      b.classList.add('active')
    })
  })

  // 列表切换：纯 DOM 实现，不依赖 execCommand（Chromium 新版对列表命令不稳定）
  function editorSelectionToEnd (el) {
    var so = window.getSelection()
    var r0 = document.createRange()
    r0.selectNodeContents(el)
    r0.collapse(false)
    so.removeAllRanges()
    so.addRange(r0)
  }
  function editorToggleList (olist) {
    var sel = window.getSelection()
    if (!sel || sel.rangeCount === 0) {
      noteEditor.focus()
      sel = window.getSelection()
    }
    if (!sel || sel.rangeCount === 0) return
    var range = sel.getRangeAt(0)
    var node = range.startContainer
    var el = node.nodeType === 3 ? node.parentNode : node

    var li = el
    while (li && li !== noteEditor && li.tagName !== 'LI') li = li.parentNode
    var curList = li && li.tagName === 'LI' && li.parentNode ? li.parentNode : null
    var newTag = olist ? 'OL' : 'UL'

    if (curList) {
      Array.prototype.slice.call(curList.children).forEach(function (it) {
        if (it.tagName !== 'LI') curList.removeChild(it)
      })
      var allLi = Array.prototype.slice.call(curList.children)
      if (curList.tagName === newTag) {
        // 同类型：取消列表，每行还原为 div
        var back = document.createDocumentFragment()
        allLi.forEach(function (it) {
          var d = document.createElement('div')
          d.className = 'note-plain'
          d.innerHTML = it.innerHTML
          back.appendChild(d)
        })
        curList.replaceWith(back)
        var firstBack = back.firstElementChild
        if (firstBack) editorSelectionToEnd(firstBack)
      } else {
        // 不同类型：原地转换（有序↔无序）
        var nl = document.createElement(newTag)
        allLi.forEach(function (it) {
          var li2 = document.createElement('li')
          li2.innerHTML = it.innerHTML
          nl.appendChild(li2)
        })
        var keepIdx = Math.max(0, allLi.indexOf(li))
        curList.replaceWith(nl)
        var keep = nl.children[Math.min(keepIdx, nl.children.length - 1)]
        if (keep) editorSelectionToEnd(keep)
      }
      return
    }

    // 不在列表中：把光标所在行变为 <ul><li>…</li></ul>
    var block = el
    while (block && block !== noteEditor) {
      var bg = block.tagName
      if (bg === 'DIV' || bg === 'P' || bg === 'UL' || bg === 'OL' || bg === 'BLOCKQUOTE') break
      block = block.parentNode
    }
    var wrap = document.createElement(newTag)
    var wrapLi = document.createElement('li')
    if (block === noteEditor || !block) {
      // 顶层无块：只处理光标所在文本节点这一行，绝不整体替换编辑器
      var textNode = node.nodeType === 3 ? node : null
      if (!textNode) {
        textNode = document.createTextNode('')
        if (node.parentNode) node.parentNode.insertBefore(textNode, node)
        else noteEditor.appendChild(textNode)
      }
      wrapLi.textContent = textNode.data
      textNode.replaceWith(wrap)
    } else {
      wrapLi.innerHTML = block.innerHTML
      block.replaceWith(wrap)
    }
    wrap.appendChild(wrapLi)
    editorSelectionToEnd(wrapLi)
  }

  // 富文本工具条
  document.querySelectorAll('#noteEditModal .tt-fmt').forEach(function (btn) {
    btn.addEventListener('click', function () {
      var fmt = btn.getAttribute('data-fmt')
      noteEditor.focus()
      if (fmt === 'link') {
        var url = prompt('输入链接地址：', 'https://')
        if (!url) return
        var sel = window.getSelection()
        if (sel && !sel.isCollapsed) {
          document.execCommand('createLink', false, url)
          document.execCommand('unlink')
          document.execCommand('createLink', false, url)
        } else {
          document.execCommand('insertHTML', false, '<a href="' + url + '" target="_blank" rel="noopener">' + url + '</a>')
        }
      } else if (fmt === 'clear') {
        document.execCommand('removeFormat', false, null)
      } else if (fmt === 'list' || fmt === 'bullet') {
        editorToggleList(false)
      } else {
        document.execCommand(fmt, false, null)
      }
    })
  })

  /* ---------- 启动（异步，从后端加载真实数据） ---------- */
  async function boot () {
    // 先用当前数据（demo mock 或本地缓存）立即渲染，避免白屏 / 只显示头部
    setupFileDnD()
    setupGroupDnD()
    renderFolderStrip()
    renderNoteWall()
    renderViews()

    try {
      var results = await Promise.allSettled([
        fetch('/api/files'),
        fetch('/api/groups'),
        fetch('/api/notes'),
        fetch('/api/config')
      ])
      var filesResp = results[0]
      if (filesResp.status === 'fulfilled' && filesResp.value.ok) {
        var d = await filesResp.value.json()
        state.files = (d.files || []).map(function (f) {
          return { id: f.id, name: f.name, path: f.relPath, category: f.category,
            size: f.size, modifiedAt: f.mtime, thumb: '', annotation: f.annotation || '' }
        })
        state.demoMode = false
      }
      var groupsResp = results[1]
      if (groupsResp.status === 'fulfilled' && groupsResp.value.ok) {
        state.groups = (await groupsResp.value.json()).groups || []
      }
      var notesResp = results[2]
      if (notesResp.status === 'fulfilled' && notesResp.value.ok) {
        state.notes = (await notesResp.value.json()).notes || []
      }
      var configResp = results[3]
      if (configResp.status === 'fulfilled' && configResp.value.ok) {
        state.folders = (await configResp.value.json()).shareFolders || []
      }
    } catch (e) { /* 后端不可用，保持 demo mock */ }

    // 拿到后端数据后重渲染
    renderFolderStrip()
    renderNoteWall()
    renderViews()
  }

  // 任何未捕获异常都提示出来，避免整页静默空白
  window.addEventListener('error', function (e) {
    var box = document.getElementById('bootError')
    if (!box) {
      box = document.createElement('div')
      box.id = 'bootError'
      box.style.cssText = 'position:fixed;left:0;right:0;bottom:0;background:#7f1d1d;color:#fff;padding:10px 14px;font-size:13px;z-index:9999;white-space:pre-wrap'
      document.body.appendChild(box)
    }
    box.textContent = '页面脚本出错：' + (e.message || e.error) + '（请截图此信息反馈）'
  })

  boot()
})()
</script>
